  <rect x="340" y="110" width="180" height="90" rx="10" fill="rgba(255,255,255,0.07)" stroke="#00d2ff" stroke-width="1.5"/>
  <path d="M 370 140 C 370 130 490 130 490 140 C 490 150 370 150 370 140 Z M 370 140 L 370 170 C 370 180 490 180 490 170 L 490 140" fill="none" stroke="#00d2ff" stroke-width="2"/>

