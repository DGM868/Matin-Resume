<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05192d"/>
      <stop offset="100%" stop-color="#004e8c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad6)"/>

  <!-- CPU Chip Graphics -->
  <g transform="translate(300, 180)">
    <rect x="-65" y="-65" width="130" height="130" rx="14" fill="#002b4d" stroke="#00d2ff" stroke-width="2.5"/>
    <rect x="-40" y="-40" width="80" height="80" rx="8" fill="#005bab"/>
    <text x="0" y="8" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">C++20</text>
    
    <!-- Pins around chip -->
    <line x1="-50" y1="-75" x2="-50" y2="-65" stroke="#00d2ff" stroke-width="3"/>
    <line x1="-25" y1="-75" x2="-25" y2="-65" stroke="#00d2ff" stroke-width="3"/>
    <line x1="0" y1="-75" x2="0" y2="-65" stroke="#00d2ff" stroke-width="3"/>
    <line x1="25" y1="-75" x2="25" y2="-65" stroke="#00d2ff" stroke-width="3"/>
    <line x1="50" y1="-75" x2="50" y2="-65" stroke="#00d2ff" stroke-width="3"/>

    <line x1="-50" y1="65" x2="-50" y2="75" stroke="#00d2ff" stroke-width="3"/>
    <line x1="-25" y1="65" x2="-25" y2="75" stroke="#00d2ff" stroke-width="3"/>
    <line x1="0" y1="65" x2="0" y2="75" stroke="#00d2ff" stroke-width="3"/>
    <line x1="25" y1="65" x2="25" y2="75" stroke="#00d2ff" stroke-width="3"/>
    <line x1="50" y1="65" x2="50" y2="75" stroke="#00d2ff" stroke-width="3"/>

    <line x1="-75" y1="-40" x2="-65" y2="-40" stroke="#00d2ff" stroke-width="3"/>
    <line x1="-75" y1="-15" x2="-65" y2="-15" stroke="#00d2ff" stroke-width="3"/>
    <line x1="-75" y1="10" x2="-65" y2="10" stroke="#00d2ff" stroke-width="3"/>
    <line x1="-75" y1="35" x2="-65" y2="35" stroke="#00d2ff" stroke-width="3"/>

    <line x1="65" y1="-40" x2="75" y2="-40" stroke="#00d2ff" stroke-width="3"/>
    <line x1="65" y1="-15" x2="75" y2="-15" stroke="#00d2ff" stroke-width="3"/>
    <line x1="65" y1="10" x2="75" y2="10" stroke="#00d2ff" stroke-width="3"/>
    <line x1="65" y1="35" x2="75" y2="35" stroke="#00d2ff" stroke-width="3"/>
  </g>

  <!-- Badge & Text -->
  <rect x="50" y="50" width="130" height="32" rx="16" fill="rgba(0,118,223,0.3)" stroke="rgba(0,210,255,0.4)" stroke-width="1"/>
  <text x="115" y="71" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#00d2ff" text-anchor="middle">C++ &amp; SYSTEM</text>

  <text x="50" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#ffffff">High-Performance Algorithmic Core</text>
  <text x="50" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="rgba(255,255,255,0.7)">Multi-threaded computational engine with memory efficiency</text>
</svg>
