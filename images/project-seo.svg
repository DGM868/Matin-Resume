  <text x="50" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="rgba(255,255,255,0.7)">Core Web Vitals analyzer, crawler &amp; schema optimizer</text>
