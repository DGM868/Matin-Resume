<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad5)"/>

  <!-- Neural Brain / AI Network -->
  <g transform="translate(300, 180)">
    <!-- Connections -->
    <line x1="-80" y1="-50" x2="0" y2="0" stroke="rgba(0,210,255,0.4)" stroke-width="2"/>
    <line x1="-80" y1="50" x2="0" y2="0" stroke="rgba(0,210,255,0.4)" stroke-width="2"/>
    <line x1="80" y1="-50" x2="0" y2="0" stroke="rgba(0,210,255,0.4)" stroke-width="2"/>
    <line x1="80" y1="50" x2="0" y2="0" stroke="rgba(0,210,255,0.4)" stroke-width="2"/>
    <line x1="-120" y1="0" x2="-80" y2="-50" stroke="rgba(0,210,255,0.3)" stroke-width="1.5"/>
    <line x1="-120" y1="0" x2="-80" y2="50" stroke="rgba(0,210,255,0.3)" stroke-width="1.5"/>
    <line x1="120" y1="0" x2="80" y2="-50" stroke="rgba(0,210,255,0.3)" stroke-width="1.5"/>
    <line x1="120" y1="0" x2="80" y2="50" stroke="rgba(0,210,255,0.3)" stroke-width="1.5"/>

    <!-- Nodes -->
    <circle cx="0" cy="0" r="18" fill="#0076df" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="-80" cy="-50" r="12" fill="#00d2ff"/>
    <circle cx="-80" cy="50" r="12" fill="#00d2ff"/>
    <circle cx="80" cy="-50" r="12" fill="#00d2ff"/>
    <circle cx="80" cy="50" r="12" fill="#00d2ff"/>
    <circle cx="-120" cy="0" r="8" fill="#ffffff" opacity="0.8"/>
    <circle cx="120" cy="0" r="8" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Badge & Text -->
  <rect x="50" y="50" width="130" height="32" rx="16" fill="rgba(0,118,223,0.3)" stroke="rgba(0,210,255,0.4)" stroke-width="1"/>
  <text x="115" y="71" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#00d2ff" text-anchor="middle">PYTHON &amp; AI APIS</text>

  <text x="50" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#ffffff">AI Workflow &amp; Assistant Bot</text>
  <text x="50" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="rgba(255,255,255,0.7)">LLM document reasoning, bot integration &amp; automation</text>
</svg>
